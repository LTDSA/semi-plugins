name: Build and publish community plugins
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'packages/*/package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semi-community-plugins-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run pack

  dist:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.archive.outputs.commit || steps.plan.outputs.commit }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Select plugin releases
        id: plan
        env:
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          head=$(git ls-remote origin refs/heads/dist)
          if [[ -n "$head" ]]; then
            git fetch --depth=1 origin refs/heads/dist
            git show FETCH_HEAD:index.json > "$RUNNER_TEMP/semi-dist-index.json"
            printf 'commit=%s\n' "$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          fi
          node scripts/plan-release.cjs "$RUNNER_TEMP/semi-dist-index.json" "$RELEASE_EVENT" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.pack != '[]'
        run: npm run build
      - if: steps.plan.outputs.pack != '[]'
        run: npm test
      - if: steps.plan.outputs.pack != '[]'
        env:
          SEMI_RELEASE_PACKAGES: ${{ steps.plan.outputs.pack }}
        run: npm run pack -- "$RUNNER_TEMP/semi-plugin-pack"
      - name: Write packages to dist
        id: archive
        if: steps.plan.outputs.pack != '[]'
        env:
          DIST_TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DIST_TOKEN" | base64 -w 0)"
          bash scripts/publish-dist.sh "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/semi-plugin-pack"

  publish:
    if: vars.ENABLE_NPM_PUBLISH == 'true' && needs.dist.outputs.publish != '[]'
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.dist.outputs.commit }}
          path: distribution
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: Publish each package
        id: npm-publish
        continue-on-error: true
        run: node scripts/publish.cjs distribution "$RUNNER_TEMP/published.json" "$RUNNER_TEMP/plugin-previews"
        env:
          SEMI_RELEASE_PACKAGES: ${{ needs.dist.outputs.publish }}
      - if: steps.npm-publish.outputs.published != '' && steps.npm-publish.outputs.published != '0'
        uses: actions/create-github-app-token@v2
        id: pages-token
        with:
          app-id: ${{ vars.RELEASES_APP_ID }}
          private-key: ${{ secrets.RELEASES_APP_PRIVATE_KEY }}
          owner: LTDSA
          repositories: semi-releases
          permission-contents: write
      - if: steps.pages-token.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: LTDSA/semi-releases
          ref: main
          path: semi-releases
          token: ${{ steps.pages-token.outputs.token }}
      - if: steps.pages-token.outcome == 'success'
        run: node scripts/sync-registry.cjs "$RUNNER_TEMP/published.json" semi-releases/docs/public/plugins/registry.json "$RUNNER_TEMP/plugin-previews"
      - name: Sync registry for Pages
        if: steps.pages-token.outcome == 'success'
        working-directory: semi-releases
        run: |
          git add -- docs/public/plugins
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=semi-plugins -c user.email=semi-plugins@users.noreply.github.com commit -m 'Update community plugin registry'
          git push origin HEAD:main

      - name: Report incomplete npm release
        if: always() && steps.npm-publish.outcome == 'failure'
        run: exit 1
